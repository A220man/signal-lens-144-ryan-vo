[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lens-144-ryan-vo"
version = "1.0.0"
description = "Cross-provider agent workflow orchestration with hook effectiveness measurement"
readme = "../README.md"
license = {text = "MIT"}
authors = [
  {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "python-multipart==0.0.9",
  "httpx==0.25.2",
  "sqlalchemy==2.0.34",
  "alembic==1.13.2",
  "aiosqlite==0.20.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-dotenv==1.0.1",
  "httpx-sse==0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.4",
  "pytest-asyncio==0.21.1",
  "pytest-httpx==0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
